<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#050A14"/>
  <!-- Outer diamond with glow -->
  <polygon points="16,3 29,16 16,29 3,16" fill="url(#g)" filter="url(#glow)"/>
  <!-- Inner cutout for depth/gem effect -->
  <polygon points="16,9 23,16 16,23 9,16" fill="#050A14" opacity="0.5"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.5" fill="url(#g)"/>
</svg>
